<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Zion Daley artist visual</title>
  <desc id="desc">Dark cinematic reggae artist identity artwork with a Jamaican street silhouette, warm street lights and muted green, gold and red accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050505"/><stop offset=".56" stop-color="#10140f"/><stop offset="1" stop-color="#020202"/></linearGradient>
