name: Export Alonzo portrait asset

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-alonzo-asset.yml
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: alonzo-source-assets
          path: |
            assets/artists/alonzo-ray-portrait.webp
            assets/artists/alonzo-ray-card.webp
            assets/artists/alonzo-ray-card-640.webp
          retention-days: 2
