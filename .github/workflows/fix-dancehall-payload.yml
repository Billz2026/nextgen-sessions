name: Fix Dancehall Payload Quote

on:
  push:
    branches: [agent/fix-mix-covers-final]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-mix-covers-final

      - name: Repair quote typo if present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('functions/mix-cover/dancehall-mashups.js')
          text = path.read_text()
          old = "Cy8MPeYy' +"
          new = 'Cy8MPeYy" +'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print('Repaired Dancehall base64 delimiter.')
          else:
              print('No repair needed.')
          PY

      - name: Commit repair if needed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add functions/mix-cover/dancehall-mashups.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix Dancehall cover payload delimiter"
          git push origin HEAD:agent/fix-mix-covers-final
