name: Update Release Catalogue

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-catalogue.yml"
      - "scripts/update-catalogue.py"
      - "scripts/discover-scheduled-releases.py"
      - "scripts/render-releases.py"
      - "scripts/enrich-release-pages.mjs"
      - "scripts/enrich-release-related-artists.mjs"
      - "scripts/render-artists.mjs"
      - "scripts/enrich-artist-schedule.mjs"
      - "scripts/render-artist-index.mjs"
      - "scripts/render-genres.mjs"
      - "scripts/release-schedule.mjs"
      - "scripts/build-weekly-feed.mjs"
      - "scripts/build-search-index.mjs"
      - "scripts/enrich-search-schedule.mjs"
      - "scripts/preserve-generated-at.mjs"
      - "scripts/sync-homepage-fallback.py"
      - "scripts/test-weekly-feed.mjs"
      - "scripts/test-site-search.mjs"
      - "scripts/test-scheduled-channel-discovery.py"
      - "scripts/test-scheduled-release-embargo.py"
      - "scripts/test-scheduled-release-source.py"
      - "scripts/test-release-archive-player.py"
      - "scripts/test-latest-policy.mjs"
      - "scripts/test-catalogue-resilience.py"
      - "scheduled-releases.json"
      - "artists.js"
      - "artist-profiles.js"
      - "artist-profiles-expanded.js"
      - "artist-images.js"
      - "genre-hubs.js"
      - "releases.js"
      - "site.js"

permissions:
  contents: write

concurrency:
  group: nextgen-main-writers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Snapshot last-known-good generated state
        run: |
          cp releases.json /tmp/releases-before.json
          cp search-index.json /tmp/search-before.json || true

      # External API calls get multiple attempts. If YouTube/API infrastructure is temporarily
      # unavailable, this run fails without touching production and the next 15-minute run retries.
      - name: Build catalogue from public playlists
        env:
          YT_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          for attempt in 1 2 3 4; do
            if python3 scripts/update-catalogue.py releases.json; then
              exit 0
            fi
            echo "Playlist catalogue attempt ${attempt}/4 failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Discover due scheduled releases from public channel
        env:
          YT_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          for attempt in 1 2 3 4; do
            if python3 scripts/discover-scheduled-releases.py; then
              exit 0
            fi
            echo "Scheduled channel discovery attempt ${attempt}/4 failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      # Core publication outputs. A failure here should block publication because the generated
      # release experience would be incomplete.
      - name: Render crawlable release archive and pages
        run: python3 scripts/render-releases.py releases.json

      - name: Preserve catalogue timestamp on no-op checks
        run: node scripts/preserve-generated-at.mjs /tmp/releases-before.json releases.json

      - name: Render crawlable artist profile pages
        run: node scripts/render-artists.mjs

      - name: Apply central release schedule to artist pages
        run: node scripts/enrich-artist-schedule.mjs

      - name: Render crawlable artist roster
        run: node scripts/render-artist-index.mjs

      - name: Render crawlable genre discovery pages
        run: node scripts/render-genres.mjs

      - name: Build New This Week release feed
        run: node scripts/build-weekly-feed.mjs

      - name: Build universal site search index
        run: node scripts/build-search-index.mjs

      - name: Add scheduled releases to site search
        run: node scripts/enrich-search-schedule.mjs

      - name: Preserve search timestamp on no-op checks
        run: node scripts/preserve-generated-at.mjs /tmp/search-before.json search-index.json

      - name: Sync homepage static fallback
        run: python3 scripts/sync-homepage-fallback.py releases.json

      # Optional enhancements must never freeze a verified release out of production. The base
      # renderer already produces functional release/artist pages, so these are best-effort.
      - name: Enrich release detail pages
        continue-on-error: true
        run: node scripts/enrich-release-pages.mjs

      - name: Enrich release discovery with related artists
        continue-on-error: true
        run: node scripts/enrich-release-related-artists.mjs

      - name: Normalize global primary navigation
        continue-on-error: true
        run: python3 scripts/normalize-primary-nav.py

      - name: Normalize canonical production domain
        continue-on-error: true
        run: python3 scripts/normalize-seo-domain.py

      - name: Normalize structured data graph
        continue-on-error: true
        run: node scripts/normalize-schema-graph.mjs

      - name: Refine structured data quality
        continue-on-error: true
        run: node scripts/refine-schema-graph.mjs

      # Release-critical integrity gates only. These protect against wrong/private/short content,
      # stale homepage/week/search output and broken core catalogue publication.
      - name: Validate catalogue integrity
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          current = json.loads(Path("releases.json").read_text(encoding="utf-8"))
          before = json.loads(Path("/tmp/releases-before.json").read_text(encoding="utf-8"))
          releases = current.get("releases", [])
          previous = before.get("releases", [])

          assert current["total"] == len(releases)
          assert len({item["id"] for item in releases}) == current["total"]
          assert current["total"] >= 80, f"Unexpectedly small catalogue: {current['total']}"
          assert current["total"] >= before.get("total", 0), (
              f"Catalogue shrank from {before.get('total', 0)} to {current['total']}"
          )
          assert len({item["url"] for item in releases}) == current["total"]
          assert all(item.get("contentType") == "full-release" for item in releases)
          assert all(item.get("durationSeconds", 0) >= 75 for item in releases)
          assert current.get("contentPolicy", {}).get("shortsAllowed") is False
          assert all(item.get("published") for item in releases)
          assert all(os.path.exists("." + item["url"] + "index.html") for item in releases)

          current_ids = {item["id"] for item in releases}
          previous_ids = {item["id"] for item in previous}
          missing = sorted(previous_ids - current_ids)
          assert not missing, f"Previously verified releases disappeared: {missing[:10]}"

          archive = Path("releases/index.html").read_text(encoding="utf-8")
          assert "Loading catalogue…" not in archive
          assert archive.count('class="archive-release-card"') >= current["total"]
          assert archive.count('data-archive-play') >= current["total"]
          print(json.dumps({"total": current["total"], "counts": current["counts"]}, indent=2))
          PY

      - name: Validate automated weekly release system
        run: node scripts/test-weekly-feed.mjs

      - name: Validate scheduled channel discovery
        run: python3 scripts/test-scheduled-channel-discovery.py

      - name: Validate universal site search
        run: node scripts/test-site-search.mjs

      - name: Validate scheduled-release embargoes
        run: python3 scripts/test-scheduled-release-embargo.py

      - name: Validate scheduled-release source safety
        run: python3 scripts/test-scheduled-release-source.py

      - name: Validate homepage static fallback
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("releases.json").read_text(encoding="utf-8"))
          releases = data.get("releases", [])
          assert releases, "Release catalogue is empty"
          latest = releases[0]
          homepage = Path("index.html").read_text(encoding="utf-8")
          site = Path("site.js").read_text(encoding="utf-8")
          assert f'data-video-id="{latest["id"]}"' in homepage, "Homepage video fallback is stale"
          assert f'href="{latest["url"]}"' in homepage, "Homepage latest-release link is stale"
          assert f'/api/release-image?id={latest["id"]}' in homepage, "Homepage thumbnail fallback is stale"
          assert latest["id"] in site, "JavaScript latest fallback is stale"
          assert "// HOMEPAGE:AUTO-FALLBACK:START" in site
          assert "// HOMEPAGE:AUTO-FALLBACK:END" in site
          print(f'Homepage fallback validated: {latest["artist"]} — {latest["title"]}')
          PY

      - name: Test release archive inline player
        run: python3 scripts/test-release-archive-player.py

      - name: Test latest-release full-track lock
        run: node scripts/test-latest-policy.mjs

      - name: Test unavailable-playlist fallback
        run: python3 scripts/test-catalogue-resilience.py

      # Atomic publication: nothing is committed until the complete core output has been generated
      # and release-critical checks have passed. A failed run leaves the last-known-good site live.
      - name: Publish changed catalogue atomically
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -u
          git add releases/
          git add this-week.json search-index.json index.html artists/ genres/
          git diff --cached --quiet && exit 0
          git commit -m "Auto-update release catalogue"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Publish attempt ${attempt}/5 failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "Could not update main after 5 attempts."
          exit 1

      # Quality checks below this point can report regressions, but publication has already happened
      # and these checks can never hold a verified release hostage.
      - name: Advisory release editorial QA
        continue-on-error: true
        run: python3 scripts/test-release-editorial.py

      - name: Advisory related-artist discovery QA
        continue-on-error: true
        run: node scripts/test-release-related-artists.mjs

      - name: Advisory artist crawlability QA
        continue-on-error: true
        run: node scripts/test-artist-static-render.mjs

      - name: Advisory artist roster QA
        continue-on-error: true
        run: node scripts/test-artist-index-static.mjs

      - name: Advisory genre crawlability QA
        continue-on-error: true
        run: python3 scripts/test-genre-static-render.py

      - name: Advisory canonical-domain QA
        continue-on-error: true
        run: python3 scripts/test-seo-domain.py

      - name: Advisory structured-data graph QA
        continue-on-error: true
        run: node scripts/test-schema-graph.mjs

      - name: Advisory structured-data quality QA
        continue-on-error: true
        run: node scripts/test-schema-quality.mjs

      - name: Advisory genre-hub QA
        continue-on-error: true
        run: python3 scripts/test-genre-hubs.py
