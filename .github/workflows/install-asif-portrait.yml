name: Install Asif Sultaan Portrait

on:
  push:
    paths:
      - ".asif-upload/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-asif-sultaan-portrait
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check upload files
        id: files
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          for part in 01 02 03 04 05 06 07; do
            if [ ! -f ".asif-upload/part-${part}.txt" ]; then
              ready=false
            fi
          done
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Decode portrait asset
        if: steps.files.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/artists
          cat .asif-upload/part-*.txt | tr -d '\r\n ' | base64 --decode > assets/artists/asif-sultaan-portrait.webp
          test -s assets/artists/asif-sultaan-portrait.webp
          file assets/artists/asif-sultaan-portrait.webp

      - name: Commit portrait asset
        if: steps.files.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/artists/asif-sultaan-portrait.webp
          git commit -m "Add approved Asif Sultaan portrait asset" || exit 0
          git push