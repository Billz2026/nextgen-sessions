name: Build Deon final assets

on:
  push:
    branches:
      - agent/complete-deon-creed
    paths:
      - ".github/workflows/build-deon-final-assets.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --quiet pillow

      - name: Rebuild approved portrait and card variants
        run: |
          set -euo pipefail
          cat \
            assets/source/deon-creed/part-00.txt \
            assets/source/deon-creed/part-01.txt \
            assets/source/deon-creed/part-02-03.txt \
            assets/source/deon-creed/part-04-05.txt \
            > /tmp/deon-approved.b64
          base64 --decode /tmp/deon-approved.b64 > /tmp/deon-approved.webp

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('/tmp/deon-approved.webp')
          image = Image.open(source).convert('RGB')
          assert image.size == (1120, 1400), image.size

          out = Path('assets/artists')
          out.mkdir(parents=True, exist_ok=True)

          image.save(out / 'deon-creed-portrait.webp', 'WEBP', quality=68, method=6)
          image.resize((1024, 1280), Image.Resampling.LANCZOS).save(
              out / 'deon-creed-card.webp', 'WEBP', quality=68, method=6
          )
          image.resize((640, 800), Image.Resampling.LANCZOS).save(
              out / 'deon-creed-card-640.webp', 'WEBP', quality=66, method=6
          )

          for filename, expected in {
              'deon-creed-portrait.webp': (1120, 1400),
              'deon-creed-card.webp': (1024, 1280),
              'deon-creed-card-640.webp': (640, 800),
          }.items():
              path = out / filename
              check = Image.open(path)
              assert check.size == expected, (filename, check.size)
              assert path.stat().st_size > 20_000, (filename, path.stat().st_size)
              print(filename, check.size, path.stat().st_size)
          PY

      - name: Remove temporary source and workflow
        run: |
          rm -rf assets/source/deon-creed
          rm -f .github/workflows/build-deon-final-assets.yml

      - name: Commit generated WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add responsive Deon Creed portrait assets"
          git push origin HEAD:${{ github.ref_name }}
