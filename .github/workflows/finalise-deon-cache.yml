name: Finalise Deon cache references

on:
  push:
    branches:
      - agent/complete-deon-creed
    paths:
      - ".github/workflows/finalise-deon-cache.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Refresh homepage and roster cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('index.html', 'artists/index.html'):
              path = Path(name)
              text = path.read_text()
              text = text.replace('artist-images.js?v=20260803-deon3', 'artist-images.js?v=20260803-deon4')
              text = text.replace('artist-profiles-expanded.js?v=20260803-deon1', 'artist-profiles-expanded.js?v=20260803-deon4')
              path.write_text(text)
          PY
          grep -q 'artist-images.js?v=20260803-deon4' index.html
          grep -q 'artist-images.js?v=20260803-deon4' artists/index.html
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/finalise-deon-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh Deon portrait cache references"
          git push origin HEAD:${{ github.ref_name }}
