name: Fix Rell Danja profile link

on:
  push:
    branches:
      - fix/rell-danja-profile-link

permissions:
  contents: write

jobs:
  fix-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/rell-danja-profile-link
          fetch-depth: 0

      - name: Add published profile mapping and refresh cache
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          profiles_path = Path('artist-profiles-expanded.js')
          profiles = profiles_path.read_text(encoding='utf-8')
          if '"rell-danja": {' not in profiles:
              marker = '  "voss-carter": {'
              rell = '''  "rell-danja": {
            "name": "Rell Danja",
            "path": "/artists/rell-danja/",
            "genre": "Jamaican Dancehall",
            "location": "Jamaica",
            "eyebrow": "NextGen Sessions featured artist",
            "headline": "Hard-edged gullyside dancehall shaped by survival, loyalty, sleepless pressure and consequences.",
            "imageKey": "rell-danja",
            "imagePosition": "50% 31%",
            "featuredVideo": {
              "id": "919KvYLP_OQ",
              "title": "Cross Me, Regret It",
              "label": "Rell Danja — Cross Me, Regret It",
              "published": "2026-07-01T18:01:56Z"
            },
            "youtubeUrl": "https://www.youtube.com/results?search_query=NextGen+Sessions+Rell+Danja"
          },
          '''
              if marker not in profiles:
                  raise SystemExit('Could not find insertion marker in artist-profiles-expanded.js')
              profiles = profiles.replace(marker, rell + marker, 1)
              profiles_path.write_text(profiles, encoding='utf-8')

          old = '/artist-profiles-expanded.js?v=20260803-reiss3'
          new = '/artist-profiles-expanded.js?v=20260804-rell-link1'
          for filename in ('index.html', 'artists/index.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if old not in text and new not in text:
                  raise SystemExit(f'Missing profile script reference in {filename}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          workflow = Path('.github/workflows/fix-rell-danja-profile-link.yml')
          workflow.unlink()
          PY

      - name: Validate internal profile destination
        run: |
          set -euo pipefail
          node --check artist-profiles-expanded.js
          grep -q '"rell-danja"' artist-profiles-expanded.js
          grep -q '"path": "/artists/rell-danja/"' artist-profiles-expanded.js
          grep -q '/artist-profiles-expanded.js?v=20260804-rell-link1' index.html
          grep -q '/artist-profiles-expanded.js?v=20260804-rell-link1' artists/index.html
          test -f artists/rell-danja/index.html

      - name: Commit production fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artist-profiles-expanded.js index.html artists/index.html .github/workflows/fix-rell-danja-profile-link.yml
          git commit -m 'Fix Rell Danja internal profile link'
          git push origin HEAD:fix/rell-danja-profile-link
