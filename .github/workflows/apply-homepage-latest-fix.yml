name: Apply homepage latest fix

on:
  push:
    branches:
      - fix/homepage-latest-and-alonzo-crop
    paths:
      - scripts/fix-homepage-merge-order.py
      - .github/workflows/apply-homepage-latest-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-latest-and-alonzo-crop
      - name: Correct homepage duplicate merge order
        run: |
          python scripts/fix-homepage-merge-order.py
          node --check site.js
          node --check functions/api/latest.js
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.js
          git commit -m "Preserve newest homepage release timestamp during failover" || exit 0
          git push
