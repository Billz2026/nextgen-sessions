name: Finalize Jay portrait

on:
  push:
    branches:
      - agent/perfect-jay-starks-profile

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Jay branch
        uses: actions/checkout@v4
        with:
          ref: agent/perfect-jay-starks-profile
          fetch-depth: 0

      - name: Build and verify portrait
        shell: bash
        run: |
          set -euo pipefail
          cat .jay-portrait/chunk-0.txt .jay-portrait/chunk-1.txt .jay-portrait/chunk-2.txt .jay-portrait/chunk-3.txt > /tmp/jay-portrait.b64
          tr -d '\r\n ' < /tmp/jay-portrait.b64 | base64 --decode > assets/artists/jay-starks-portrait-v4.webp
          echo '76299d73b0dfd521649b32afc963d3f5f03f0e610a364478f10a654ed1ac7e0b  assets/artists/jay-starks-portrait-v4.webp' | sha256sum --check
          test "$(stat -c%s assets/artists/jay-starks-portrait-v4.webp)" -eq 16900
          file assets/artists/jay-starks-portrait-v4.webp | grep -q 'Web/P image'
          rm -rf .jay-portrait
          rm -f .github/workflows/finalize-jay-portrait.yml

      - name: Commit verified binary portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize verified Jay Starks portrait"
          git push origin HEAD:agent/perfect-jay-starks-profile
