name: Install Jay Starks portrait

on:
  push:
    branches:
      - agent/perfect-jay-starks-profile
    paths:
      - .github/workflows/install-jay-starks-portrait.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/perfect-jay-starks-profile

      - name: Decode and validate portrait
        run: |
          set -euo pipefail
          mkdir -p assets/artists
          cat .tmp/jay-starks-portrait.part* | base64 --decode > assets/artists/jay-starks-portrait.webp
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          path = 'assets/artists/jay-starks-portrait.webp'
          image = Image.open(path)
          if image.format != 'WEBP':
              raise SystemExit(f'Unexpected format: {image.format}')
          if image.size != (1122, 1402):
              raise SystemExit(f'Unexpected dimensions: {image.size}')
          print(f'Validated {path}: {image.size[0]}x{image.size[1]} {image.format}')
          PY

      - name: Commit final asset and remove staging files
        run: |
          set -euo pipefail
          rm -f .tmp/jay-starks-portrait.part*
          rm -f .github/workflows/install-jay-starks-portrait.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install approved Jay Starks portrait asset"
          git push origin HEAD:agent/perfect-jay-starks-profile
