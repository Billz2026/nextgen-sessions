name: Build Reiss profile assets

on:
  push:
    branches:
      - agent/reiss-profile-build
    paths:
      - ".github/workflows/build-reiss-profile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reiss branch
        uses: actions/checkout@v4
        with:
          ref: agent/reiss-profile-build
          fetch-depth: 0

      - name: Install image tools
        run: python -m pip install --quiet --upgrade pillow

      - name: Generate responsive Reiss portrait assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/reiss-build assets/artists
          curl --fail --location --silent --show-error \
            "https://i.ytimg.com/vi/FvNsYb5g4pg/maxresdefault.jpg" \
            --output /tmp/reiss-build/source.jpg

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance

          source = Image.open('/tmp/reiss-build/source.jpg').convert('RGB')
          assert source.size == (1280, 720), source.size

          # Clean right-hand subject crop from On A Regular. This excludes all release text.
          crop = source.crop((612, 0, 1188, 720))
          crop = ImageEnhance.Contrast(crop).enhance(1.04)
          crop = ImageEnhance.Sharpness(crop).enhance(1.08)

          outputs = {
              'assets/artists/reiss-portrait.webp': ((1120, 1400), 90),
              'assets/artists/reiss-card.webp': ((1024, 1280), 88),
              'assets/artists/reiss-card-640.webp': ((640, 800), 86),
          }
          for filename, (dimensions, quality) in outputs.items():
              image = crop.resize(dimensions, Image.Resampling.LANCZOS)
              image.save(filename, 'WEBP', quality=quality, method=6)
              print(filename, dimensions, Path(filename).stat().st_size)
          PY

      - name: Complete Reiss profile and catalogue integration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          version = '20260803-reiss1'

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          # Responsive image map used by homepage, roster and artist profile.
          path = 'artist-images.js'
          text = read(path)
          if '"reiss": {' not in text:
              entry = '''  "reiss": {\n    src: "/assets/artists/reiss-card.webp?v=20260803-reiss1",\n    srcset: "/assets/artists/reiss-card-640.webp?v=20260803-reiss1 640w, /assets/artists/reiss-card.webp?v=20260803-reiss1 1024w",\n    portrait: "/assets/artists/reiss-portrait.webp?v=20260803-reiss1",\n    fallback: "/assets/artists/reiss-card-640.webp?v=20260803-reiss1",\n    position: "50% 32%"\n  },\n'''
              marker = '  "alonzo-ray": {'
              assert marker in text
              text = text.replace(marker, entry + marker, 1)
          write(path, text)

          # Complete profile data with four verified singles and the dedicated image key.
          path = 'artist-profiles-expanded.js'
          text = read(path)
          reiss_block = '''  "reiss": {\n    "name": "Reiss",\n    "path": "/artists/reiss/",\n    "genre": "UK Rap",\n    "location": "United Kingdom",\n    "eyebrow": "NextGen Sessions featured artist",\n    "headline": "Focused UK rap shaped by discipline, earned progress, direct delivery and refusal to expect shortcuts.",\n    "bio": [\n      "Reiss represents a focused UK rap lane within NextGen Sessions, favouring concise writing, direct delivery and records built around steady progress rather than exaggerated claims.",\n      "His catalogue moves through routine, momentum and self-reliance, with the Nothing Given album tying those themes into a clear statement about earning every step forward."\n    ],\n    "imageKey": "reiss",\n    "imagePosition": "50% 32%",\n    "featuredVideo": {\n      "id": "Dvfg251n0Pk",\n      "title": "On Route",\n      "label": "Reiss — On Route",\n      "published": "2026-04-26T17:08:28Z"\n    },\n    "catalogueAliases": ["Reiss"],\n    "additionalReleases": [\n      {\n        "id": "Dvfg251n0Pk",\n        "artist": "Reiss",\n        "title": "On Route",\n        "group": "UK Rap & Grime",\n        "published": "2026-04-26T17:08:28Z"\n      },\n      {\n        "id": "FvNsYb5g4pg",\n        "artist": "Reiss",\n        "title": "On A Regular",\n        "group": "UK Rap & Grime",\n        "published": "2026-04-26T16:13:21Z"\n      },\n      {\n        "id": "hqMBHn0L_DM",\n        "artist": "Reiss",\n        "title": "Already Know",\n        "group": "UK Rap & Grime",\n        "published": "2026-04-24T12:30:10Z"\n      },\n      {\n        "id": "vsvn0Qkifv0",\n        "artist": "Reiss",\n        "title": "No Comment",\n        "group": "UK Rap & Grime",\n        "published": "2026-04-15T16:06:39Z"\n      }\n    ],\n    "featuredExperience": {\n      "enabled": true,\n      "albumLabel": "Nothing Given album",\n      "aboutLabel": "About Reiss",\n      "compactViewThreshold": 10\n    },\n    "youtubeUrl": "https://www.youtube.com/results?search_query=NextGen+Sessions+Reiss",\n    "related": [\n      { "name": "Renz Cole", "genre": "UK Rap" },\n      { "name": "Andre Kadeem", "genre": "UK Rap" },\n      { "name": "Mace K", "genre": "UK Rap / Grime" }\n    ]\n  },\n'''
          pattern = re.compile(r'  "reiss": \{.*?\n  \},\n  "voss-carter":', re.S)
          assert pattern.search(text), 'Reiss profile block not found'
          text = pattern.sub(reiss_block + '  "voss-carter":', text, count=1)
          write(path, text)

          # Connect the verified singles to the Nothing Given album presentation.
          path = 'artist-albums.js'
          text = read(path)
          album_block = '''    "reiss": [\n      {\n        title: "Nothing Given",\n        year: "2026",\n        coverVideoId: "ULjYMdDHySM",\n        fullAlbumVideoId: "ULjYMdDHySM",\n        description: "A focused UK rap album centred on discipline, earned progress and refusing to expect shortcuts.",\n        tracks: [\n          { id: "vsvn0Qkifv0", title: "No Comment" },\n          { id: "hqMBHn0L_DM", title: "Already Know" },\n          { id: "FvNsYb5g4pg", title: "On A Regular" },\n          { id: "Dvfg251n0Pk", title: "On Route" }\n        ]\n      }\n    ],\n'''
          pattern = re.compile(r'    "reiss": \[.*?\n    \],\n    "voss-carter":', re.S)
          assert pattern.search(text), 'Reiss album block not found'
          text = pattern.sub(album_block + '    "voss-carter":', text, count=1)
          write(path, text)

          # Reiss page metadata and social preview now use the dedicated portrait.
          path = 'artists/reiss/index.html'
          text = read(path)
          portrait = 'https://nextgensessions.com/assets/artists/reiss-portrait.webp?v=20260803-reiss1'
          text = re.sub(r'https://i\.ytimg\.com/vi/ULjYMdDHySM/maxresdefault\.jpg', portrait, text)
          text = text.replace(
              '<meta property="og:image" content="' + portrait + '">',
              '<meta property="og:image" content="' + portrait + '">\n  <meta property="og:image:alt" content="Reiss portrait">'
          )
          schema = {
              '@context': 'https://schema.org',
              '@type': 'MusicGroup',
              'name': 'Reiss',
              'genre': 'UK Rap',
              'url': 'https://nextgensessions.com/artists/reiss/',
              'image': portrait,
              'album': {
                  '@type': 'MusicAlbum',
                  'name': 'Nothing Given',
                  'url': 'https://www.youtube.com/watch?v=ULjYMdDHySM'
              },
              'subjectOf': [
                  {'@type': 'MusicVideoObject', 'name': 'On Route', 'url': 'https://www.youtube.com/watch?v=Dvfg251n0Pk'},
                  {'@type': 'MusicVideoObject', 'name': 'On A Regular', 'url': 'https://www.youtube.com/watch?v=FvNsYb5g4pg'},
                  {'@type': 'MusicVideoObject', 'name': 'Already Know', 'url': 'https://www.youtube.com/watch?v=hqMBHn0L_DM'},
                  {'@type': 'MusicVideoObject', 'name': 'No Comment', 'url': 'https://www.youtube.com/watch?v=vsvn0Qkifv0'}
              ],
              'memberOf': {
                  '@type': 'Organization',
                  'name': 'NextGen Sessions',
                  'url': 'https://nextgensessions.com/'
              }
          }
          schema_tag = '<script type="application/ld+json">' + json.dumps(schema, separators=(',', ':')) + '</script>'
          text = re.sub(r'<script type="application/ld\+json">.*?</script>', schema_tag, text, count=1)
          text = re.sub(r'/artist-images\.js(?:\?v=[^"\s]+)?', '/artist-images.js?v=' + version, text)
          text = re.sub(r'/artist-profiles-expanded\.js(?:\?v=[^"\s]+)?', '/artist-profiles-expanded.js?v=' + version, text)
          text = re.sub(r'/artist-albums\.js(?:\?v=[^"\s]+)?', '/artist-albums.js?v=' + version, text)
          write(path, text)

          # Bust cached image/profile maps on homepage and full roster.
          for path in ('index.html', 'artists/index.html'):
              text = read(path)
              text = re.sub(r'/artist-images\.js(?:\?v=[^"\s]+)?', '/artist-images.js?v=' + version, text)
              text = re.sub(r'/artist-profiles-expanded\.js(?:\?v=[^"\s]+)?', '/artist-profiles-expanded.js?v=' + version, text)
              write(path, text)

          # Add a focused validator for responsive assets, catalogue and playback.
          validator = r'''name: Validate Reiss profile

on:
  pull_request:
    paths:
      - "artist-images.js"
      - "artist-profiles-expanded.js"
      - "artist-albums.js"
      - "index.html"
      - "artists/index.html"
      - "artists/reiss/**"
      - "assets/artists/reiss-portrait.webp"
      - "assets/artists/reiss-card.webp"
      - "assets/artists/reiss-card-640.webp"
      - ".github/workflows/validate-reiss-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          python -m pip install --quiet pillow
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate JavaScript syntax
        run: |
          node --check artist-images.js
          node --check artist-profiles-expanded.js
          node --check artist-albums.js

      - name: Validate responsive Reiss assets and references
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          from PIL import Image

          expected = {
              'assets/artists/reiss-portrait.webp': (1120, 1400),
              'assets/artists/reiss-card.webp': (1024, 1280),
              'assets/artists/reiss-card-640.webp': (640, 800),
          }
          for filename, dimensions in expected.items():
              path = Path(filename)
              data = path.read_bytes()
              assert data[:4] == b'RIFF', (filename, data[:4])
              assert data[8:12] == b'WEBP', (filename, data[8:12])
              image = Image.open(path)
              assert image.size == dimensions, (filename, image.size)
              assert len(data) > 40_000, (filename, len(data))
              print(filename, image.size, len(data))
          PY2
          grep -q 'reiss-card.webp?v=20260803-reiss1' artist-images.js
          grep -q 'reiss-card-640.webp?v=20260803-reiss1' artist-images.js
          grep -q 'reiss-portrait.webp?v=20260803-reiss1' artist-images.js
          grep -q '"imageKey": "reiss"' artist-profiles-expanded.js
          for id in Dvfg251n0Pk FvNsYb5g4pg hqMBHn0L_DM vsvn0Qkifv0 ULjYMdDHySM; do
            grep -q "$id" artist-profiles-expanded.js artist-albums.js artists/reiss/index.html
          done

      - name: Run desktop and mobile browser smoke tests
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/reiss-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          cat > ./reiss-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });

          async function visibleImage(locator) {
            await locator.scrollIntoViewIfNeeded();
            await locator.waitFor({ state: 'visible' });
            await locator.evaluate(async image => {
              if (!image.complete && typeof image.decode === 'function') {
                try { await image.decode(); } catch (_) {}
              }
            });
            const state = await locator.evaluate(image => ({
              complete: image.complete,
              naturalWidth: image.naturalWidth,
              naturalHeight: image.naturalHeight,
              currentSrc: image.currentSrc,
              hidden: image.hidden,
              display: getComputedStyle(image).display,
              visibility: getComputedStyle(image).visibility
            }));
            assert.equal(state.complete, true);
            assert.equal(state.hidden, false);
            assert.notEqual(state.display, 'none');
            assert.notEqual(state.visibility, 'hidden');
            assert.ok(state.currentSrc.includes('reiss-'), JSON.stringify(state));
            assert.ok(state.naturalWidth > 0, JSON.stringify(state));
            assert.ok(state.naturalHeight > state.naturalWidth, JSON.stringify(state));
          }

          for (const test of [
            { name: 'desktop', viewport: { width: 1440, height: 1000 } },
            { name: 'mobile', viewport: { width: 390, height: 844 } }
          ]) {
            const page = await browser.newPage({ viewport: test.viewport });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            const featured = page.locator('.featured-artist-card', { hasText: 'Reiss' });
            await visibleImage(featured.locator('img.featured-artist-image'));

            await page.goto('http://127.0.0.1:4173/artists/', { waitUntil: 'networkidle' });
            const roster = page.locator('.artist-roster-card', { hasText: 'Reiss' });
            await visibleImage(roster.locator('img.artist-roster-image'));

            await page.goto('http://127.0.0.1:4173/artists/reiss/', { waitUntil: 'networkidle' });
            await visibleImage(page.locator('.profile-image'));
            assert.equal(await page.locator('.profile-image-shell.profile-image-missing').count(), 0);

            const count = page.locator('[data-discography-count]');
            await count.waitFor({ state: 'visible' });
            await page.waitForFunction(() => /4 releases/i.test(document.querySelector('[data-discography-count]')?.textContent || ''));
            assert.match(await count.innerText(), /4 releases/i);
            await page.getByText('Nothing Given', { exact: true }).first().waitFor({ state: 'visible' });

            const route = page.locator('.discography-card', { hasText: 'On Route' });
            await route.waitFor({ state: 'visible' });
            await route.getByRole('button', { name: 'Play here' }).click();
            const iframe = page.locator('[data-featured-frame] iframe');
            await iframe.waitFor({ state: 'attached' });
            const source = await iframe.getAttribute('src');
            assert.ok(source.includes('Dvfg251n0Pk'), source);
            assert.ok(source.includes('autoplay=1'), source);

            await page.screenshot({ path: `/tmp/reiss-${test.name}.png`, fullPage: true });
            await page.close();
          }

          await browser.close();
          JS
          node ./reiss-smoke.mjs
          rm -f ./reiss-smoke.mjs

      - name: Upload responsive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: reiss-responsive-smoke
          path: |
            /tmp/reiss-desktop.png
            /tmp/reiss-mobile.png
          retention-days: 7
'''
          Path('.github/workflows/validate-reiss-profile.yml').write_text(validator, encoding='utf-8')
          PY

      - name: Validate generated files
        run: |
          set -euo pipefail
          node --check artist-images.js
          node --check artist-profiles-expanded.js
          node --check artist-albums.js
          python3 - <<'PY'
          from PIL import Image
          expected = {
              'assets/artists/reiss-portrait.webp': (1120, 1400),
              'assets/artists/reiss-card.webp': (1024, 1280),
              'assets/artists/reiss-card-640.webp': (640, 800),
          }
          for filename, size in expected.items():
              image = Image.open(filename)
              assert image.size == size, (filename, image.size)
          PY

      - name: Commit completed Reiss build
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/audit-reiss-source.yml .github/workflows/build-reiss-profile.yml
          git add artist-images.js artist-profiles-expanded.js artist-albums.js index.html artists/index.html artists/reiss/index.html assets/artists/reiss-portrait.webp assets/artists/reiss-card.webp assets/artists/reiss-card-640.webp .github/workflows/validate-reiss-profile.yml
          git commit -m "Complete Reiss portrait and profile"
          git push origin HEAD:agent/reiss-profile-build
