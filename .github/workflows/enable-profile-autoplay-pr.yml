name: Enable profile autoplay from PR

on:
  pull_request:
    paths:
      - ".github/workflows/enable-profile-autoplay-pr.yml"
      - "scripts/enable-profile-autoplay.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reiss branch
        uses: actions/checkout@v4
        with:
          ref: agent/reiss-profile-build
          fetch-depth: 0

      - name: Enable one-click artist playback
        run: python scripts/enable-profile-autoplay.py

      - name: Validate shared player
        run: |
          set -euo pipefail
          node --check artist-profile.js
          grep -q 'autoplay=1' artist-profile.js
          grep -q 'featuredFrame(release, false, "", true)' artist-profile.js
          grep -q 'artist-profile.js?v=20260803-autoplay1' artists/reiss/index.html

      - name: Commit shared playback fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/enable-profile-autoplay-pr.yml scripts/enable-profile-autoplay.py
          git add artist-profile.js artists/reiss/index.html .github/workflows/validate-reiss-profile.yml
          git commit -m "Enable one-click playback on artist profiles"
          git push origin HEAD:agent/reiss-profile-build
