name: Site Quality Assurance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-quality.yml"
      - "scripts/test-primary-nav.py"
      - "scripts/test-global-footer.py"
      - "scripts/test-conversion-funnel.py"
      - "scripts/test-responsive-shell.py"
      - "scripts/test-artist-index-static.mjs"
      - "scripts/render-artist-index.mjs"
      - "index.html"
      - "albums/**"
      - "album-discovery.css"
      - "album-discovery.js"
      - "scripts/render-album-discovery.py"
      - "site.js"
      - "styles.css"
      - "featured-artists-12.css"
      - "homepage-2027.css"
      - "releases/index.html"
      - "releases.css"
      - "releases.js"
      - "scripts/test-artist-static-render.mjs"
      - "scripts/test-mobile-browser.mjs"
      - "scripts/render-artists.mjs"
      - "artist-profile.css"
      - "artist-discography.css"
      - "artists/**"
      - "artists.js"
      - "scripts/test-analytics-system.mjs"
      - "mobile-nav.css"
      - "mobile-nav.js"
      - "site-metrics.js"
      - "conversion-funnel.css"
      - "privacy/**"
      - "404.html"
      - "submit.html"
      - "functions/api/**"
      - "ops/**"
      - "trending.js"
      - "trending.css"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Normalize generated navigation for validation
        run: python3 scripts/normalize-primary-nav.py

      - name: Test global primary navigation
        run: python3 scripts/test-primary-nav.py

      - name: Test global Privacy footer
        run: python3 scripts/test-global-footer.py

      - name: Test Listen Subscribe Follow funnel
        run: python3 scripts/test-conversion-funnel.py

      - name: Test responsive shell
        run: python3 scripts/test-responsive-shell.py

      - name: Test artist roster and featured selection
        run: node scripts/test-artist-index-static.mjs

      - name: Test every artist profile and verified video player
        run: node scripts/test-artist-static-render.mjs

      - name: Test analytics and Trending architecture
        run: node scripts/test-analytics-system.mjs

  mobile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Install headless Chromium for responsive browser QA
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Verify actual mobile and desktop presentation
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nextgen-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node scripts/test-mobile-browser.mjs
