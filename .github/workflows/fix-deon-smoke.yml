name: Fix Deon smoke test path

on:
  push:
    branches:
      - agent/complete-deon-creed
    paths:
      - ".github/workflows/fix-deon-smoke.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Keep Playwright script inside the repository
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/validate-deon-profile.yml')
          text = path.read_text().replace('/tmp/deon-smoke.mjs', './deon-smoke.mjs')
          path.write_text(text)
          PY
          rm -f .github/workflows/fix-deon-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Deon browser smoke test module resolution"
          git push origin HEAD:${{ github.ref_name }}
