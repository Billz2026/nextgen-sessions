name: Check Cloudflare Deploy Auth

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-cloudflare-auth.yml"
      - ".cloudflare-deploy-trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -eu
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "CLOUDFLARE_API_TOKEN=present"; else echo "CLOUDFLARE_API_TOKEN=missing"; fi
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo "CLOUDFLARE_ACCOUNT_ID=present"; else echo "CLOUDFLARE_ACCOUNT_ID=missing"; fi
          if [ -n "${CF_API_TOKEN:-}" ]; then echo "CF_API_TOKEN=present"; else echo "CF_API_TOKEN=missing"; fi
          if [ -n "${CF_ACCOUNT_ID:-}" ]; then echo "CF_ACCOUNT_ID=present"; else echo "CF_ACCOUNT_ID=missing"; fi

          if { [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; } || \
             { [ -n "${CF_API_TOKEN:-}" ] && [ -n "${CF_ACCOUNT_ID:-}" ]; }; then
            echo "Cloudflare deployment credentials are available to GitHub Actions."
          else
            echo "No complete standard Cloudflare deployment credential pair is configured."
            exit 1
          fi
