name: Apply homepage latest fix

on:
  push:
    branches:
      - fix/homepage-latest-and-alonzo-crop
    paths:
      - scripts/refine-homepage-latest-fix.py
      - .github/workflows/apply-homepage-latest-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-latest-and-alonzo-crop
      - name: Apply refined production changes
        run: |
          python scripts/refine-homepage-latest-fix.py
          node --check site.js
          node --check functions/api/latest.js
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/latest.js site.js index.html artist-profiles.js artists/alonzo-ray/index.html
          git commit -m "Make homepage latest release resilient to YouTube outages" || exit 0
          git push
