name: Upgrade Release Page Shell

on:
  push:
    branches: [main]
    paths:
      - "scripts/upgrade-release-page-shell.py"

permissions:
  contents: write

concurrency:
  group: nextgen-main-writers
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upgrade generated release shell
        run: python3 scripts/upgrade-release-page-shell.py

      - name: Rebuild all release pages
        run: python3 scripts/render-releases.py releases.json

      - name: Validate premium release shell
        run: |
          python3 -m py_compile scripts/render-releases.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('releases.json').read_text(encoding='utf-8'))
          pages = [Path('.' + item['url']) / 'index.html' for item in data['releases']]
          assert pages, 'No release pages found'
          for page in pages:
              assert page.exists(), f'Missing release page: {page}'
              html = page.read_text(encoding='utf-8')
              assert '/assets/nextgen-header-wordmark-2026.webp' in html, f'New wordmark missing: {page}'
              assert '/assets/nextgen-header.webp' not in html, f'Old header asset remains: {page}'
              assert '<a href="/#about">About</a>' in html, f'About nav missing: {page}'
              assert 'https://www.tiktok.com/@nextgensessions' in html, f'TikTok footer link missing: {page}'
              assert 'https://www.instagram.com/next.gensessions/' in html, f'Instagram footer link missing: {page}'
              assert 'mailto:contact@nextgensessions.com' in html, f'Contact footer link missing: {page}'
              assert '/styles.css?v=20260809-header1' in html, f'Current global stylesheet version missing: {page}'
          print(f'Validated premium shell on {len(pages)} release pages')
          PY
          python3 scripts/test-release-archive-player.py

      - name: Publish upgraded release pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add scripts/render-releases.py releases/ sitemap.xml artists/ artist-profiles.js artist-profiles-expanded.js
          git diff --cached --quiet && exit 0
          git commit -m "Standardise release pages with premium site shell"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
