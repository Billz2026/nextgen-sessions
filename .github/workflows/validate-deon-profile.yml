name: Validate Deon Creed profile

on:
  pull_request:
    paths:
      - "artist-images.js"
      - "index.html"
      - "artists/index.html"
      - "artists/deon-creed/**"
      - "assets/artists/deon-creed-portrait.webp"
      - "deon-creed-profile-fix.js"
      - ".github/workflows/validate-deon-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check artist-images.js
          node --check deon-creed-profile-fix.js

      - name: Validate direct portrait file
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          image = Path('assets/artists/deon-creed-portrait.webp').read_bytes()
          assert len(image) == 12700, f'Unexpected portrait size: {len(image)}'
          assert image[:4] == b'RIFF', f'Invalid RIFF header: {image[:4]!r}'
          assert image[8:12] == b'WEBP', f'Invalid WebP signature: {image[8:12]!r}'
          print('Direct portrait verified:', len(image), 'bytes')
          PY

      - name: Validate website references
        run: |
          set -euo pipefail
          grep -q '/assets/artists/deon-creed-portrait.webp?v=20260803-3' artist-images.js
          grep -q '/assets/artists/deon-creed-portrait.webp?v=20260803-3' deon-creed-profile-fix.js
          grep -q 'artist-images.js?v=20260803-deon3' index.html
          grep -q 'artist-images.js?v=20260803-deon3' artists/index.html
          grep -q 'artist-images.js?v=20260803-deon3' artists/deon-creed/index.html
