name: Fix Artist Runtime Overrides

on:
  push:
    branches: [main]
    paths:
      - "scripts/fix-artist-runtime-overrides.py"

permissions:
  contents: write

concurrency:
  group: nextgen-main-writers
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/fix-artist-runtime-overrides.py
      - name: Validate corrected runtime data
        run: |
          ! grep -q 'deon.genre = "Soul / R&B"' artist-images.js
          grep -q 'deon.genre = "Hip-Hop"' artist-images.js
          grep -q 'artist-images.js?v=20260824-zion2' index.html
      - name: Publish fixes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add artist-images.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Deon runtime genre override"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
