name: Install Homepage Fallback Sync

on:
  push:
    branches: [main]
    paths:
      - "scripts/install-homepage-fallback-sync.py"

permissions:
  contents: write

concurrency:
  group: nextgen-main-writers
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install homepage fallback sync
        run: python3 scripts/install-homepage-fallback-sync.py

      - name: Render current homepage fallback
        run: python3 scripts/render-releases.py releases.json

      - name: Validate renderer and homepage JavaScript
        run: |
          python3 -m py_compile scripts/render-releases.py
          node --check site.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('releases.json').read_text(encoding='utf-8'))
          releases = data['releases']
          assert releases, 'Release catalogue is empty'
          latest = releases[0]
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('site.js').read_text(encoding='utf-8')
          assert f'data-video-id="{latest["id"]}"' in html
          assert f'href="{latest["url"]}"' in html
          assert f'/api/release-image?id={latest["id"]}' in html
          assert latest['id'] in js
          assert '// HOMEPAGE:AUTO-FALLBACK:START' in js
          assert '// HOMEPAGE:AUTO-FALLBACK:END' in js
          assert 'Validate homepage static fallback' in Path('.github/workflows/update-catalogue.yml').read_text(encoding='utf-8')
          print(f'Homepage fallback synced to {latest["artist"]} — {latest["title"]}')
          PY

      - name: Publish production changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add scripts/render-releases.py .github/workflows/update-catalogue.yml index.html site.js releases.json releases/ sitemap.xml artists/ artist-profiles.js artist-profiles-expanded.js
          git diff --cached --quiet && exit 0
          git commit -m "Automate homepage fallback from release catalogue"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
