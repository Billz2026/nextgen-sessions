name: Diagnose Summer Cover Chunks

on:
  push:
    branches: [agent/fix-mix-covers-final]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-mix-covers-final

      - name: Record Summer chunk lengths and hashes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const expected = [
            [6000,'78509ac88bf5731bc85ec5630e6ca858587145facb2665e3a514d5f311264162'],
            [6000,'3fb669770114a86df1dab2907c4fc5bfbbe94233a6ff22420b54256484347fc1'],
            [6000,'fbc4a0a146b587d5df43a9b163ea55e67a927cb7f4f9ca10e9e7c4041d285c15'],
            [6000,'a07fc72be60de148e3ded0378ba33813edb79cd619cde83fd6f52d0121bc942c'],
            [6000,'3925f23570db542b31b7b9c5f88cafc1bafd0c27ec2de97e3696e0c5224b5f93'],
            [3900,'bdf64f334705997c141681ec30447dd6049299ccdf835e10d36baaf601a25aeb']
          ];
          const lines=[];
          let allOk=true;
          for(let i=1;i<=6;i++){
            const text=fs.readFileSync(`functions/_mix_cover_data/sound-of-summer-${i}.js`,'utf8');
            const m=text.match(/^export default "([A-Za-z0-9+/=]+)";/);
            const value=m?m[1]:'';
            const hash=crypto.createHash('sha256').update(value).digest('hex');
            const [elen,ehash]=expected[i-1];
            const ok=value.length===elen && hash===ehash;
            allOk=allOk&&ok;
            lines.push(`${ok?'OK':'FAIL'} chunk=${i} chars=${value.length}/${elen} sha256=${hash}/${ehash}`);
          }
          lines.unshift(allOk?'ALL_SUMMER_CHUNKS_OK':'SUMMER_CHUNK_FAILURE');
          fs.mkdirSync('validation',{recursive:true});
          fs.writeFileSync('validation/summer-chunks-status.txt',lines.join('\n')+'\n');
          console.log(lines.join('\n'));
          NODE

      - name: Commit diagnostic marker
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add validation/summer-chunks-status.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record Summer cover chunk status"
          git push origin HEAD:agent/fix-mix-covers-final
