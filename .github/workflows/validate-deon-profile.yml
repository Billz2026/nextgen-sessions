name: Validate Deon Creed profile

on:
  pull_request:
    paths:
      - "artist-images.js"
      - "artist-profiles-expanded.js"
      - "index.html"
      - "artists/index.html"
      - "artists/deon-creed/**"
      - "assets/artists/deon-creed-portrait.webp"
      - "assets/artists/deon-creed-card.webp"
      - "assets/artists/deon-creed-card-640.webp"
      - "deon-creed-profile-fix.js"
      - ".github/workflows/validate-deon-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          python -m pip install --quiet pillow
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate JavaScript syntax
        run: |
          node --check artist-images.js
          node --check artist-profiles-expanded.js
          node --check deon-creed-profile-fix.js

      - name: Validate responsive portrait files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              'assets/artists/deon-creed-portrait.webp': (1120, 1400),
              'assets/artists/deon-creed-card.webp': (1024, 1280),
              'assets/artists/deon-creed-card-640.webp': (640, 800),
          }
          for filename, dimensions in expected.items():
              path = Path(filename)
              data = path.read_bytes()
              assert data[:4] == b'RIFF', (filename, data[:4])
              assert data[8:12] == b'WEBP', (filename, data[8:12])
              image = Image.open(path)
              assert image.size == dimensions, (filename, image.size)
              assert len(data) > 20_000, (filename, len(data))
              print(filename, image.size, len(data))
          PY

      - name: Validate catalogue and cache references
        run: |
          set -euo pipefail
          grep -q 'deon-creed-card.webp?v=20260803-4' artist-images.js
          grep -q 'deon-creed-card-640.webp?v=20260803-4' artist-images.js
          grep -q 'deon-creed-portrait.webp?v=20260803-4' artist-images.js
          grep -q 'ZSjRD_3B5uk' artist-profiles-expanded.js
          grep -q 'Days Like These' artist-profiles-expanded.js
          grep -q 'ZSjRD_3B5uk' deon-creed-profile-fix.js
          grep -q 'autoplay=1' deon-creed-profile-fix.js
          grep -q 'artist-images.js?v=20260803-deon4' index.html
          grep -q 'artist-images.js?v=20260803-deon4' artists/index.html
          grep -q 'artist-images.js?v=20260803-deon4' artists/deon-creed/index.html

      - name: Run desktop and mobile browser smoke tests
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/deon-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          cat > ./deon-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });

          async function visibleImage(locator, minimumWidth = 300) {
            await locator.scrollIntoViewIfNeeded();
            await locator.waitFor({ state: 'visible' });
            await locator.evaluate(async (image) => {
              if (!image.complete && typeof image.decode === 'function') {
                try {
                  await image.decode();
                } catch (_) {
                  // The assertions below report any genuine load failure.
                }
              }
            });
            const result = await locator.evaluate((image) => ({
              complete: image.complete,
              naturalWidth: image.naturalWidth,
              naturalHeight: image.naturalHeight,
              currentSrc: image.currentSrc,
              hidden: image.hidden,
              display: getComputedStyle(image).display,
              visibility: getComputedStyle(image).visibility
            }));
            assert.equal(result.complete, true);
            assert.equal(result.hidden, false);
            assert.notEqual(result.display, 'none');
            assert.notEqual(result.visibility, 'hidden');
            assert.ok(result.currentSrc.includes('deon-creed-'), JSON.stringify(result));
            assert.ok(result.naturalWidth >= minimumWidth, JSON.stringify(result));
            assert.ok(result.naturalHeight > result.naturalWidth, JSON.stringify(result));
          }

          for (const test of [
            { name: 'desktop', viewport: { width: 1440, height: 1000 } },
            { name: 'mobile', viewport: { width: 390, height: 844 } }
          ]) {
            const page = await browser.newPage({ viewport: test.viewport });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            const featuredCard = page.locator('.featured-artist-card', { hasText: 'Deon Creed' });
            await visibleImage(featuredCard.locator('img.featured-artist-image'));

            await page.goto('http://127.0.0.1:4173/artists/', { waitUntil: 'networkidle' });
            const rosterCard = page.locator('.artist-roster-card', { hasText: 'Deon Creed' });
            await visibleImage(rosterCard.locator('img.artist-roster-image'));

            await page.goto('http://127.0.0.1:4173/artists/deon-creed/', { waitUntil: 'networkidle' });
            const profileImage = page.locator('.profile-image');
            await visibleImage(profileImage);
            assert.equal(await page.locator('.profile-image-shell.profile-image-missing').count(), 0);

            const count = page.locator('[data-discography-count]');
            await count.waitFor({ state: 'visible' });
            await page.waitForFunction(() => {
              const value = document.querySelector('[data-discography-count]')?.textContent || '';
              return /2 releases/i.test(value);
            });
            assert.match(await count.innerText(), /2 releases/i);

            const daysCard = page.locator('.discography-card', { hasText: 'Days Like These' });
            await daysCard.waitFor({ state: 'visible' });
            await daysCard.getByRole('button', { name: 'Play here' }).click();

            const iframe = page.locator('[data-featured-frame] iframe');
            await iframe.waitFor({ state: 'attached' });
            const source = await iframe.getAttribute('src');
            assert.ok(source.includes('ZSjRD_3B5uk'), source);
            assert.ok(source.includes('autoplay=1'), source);

            await page.screenshot({ path: `/tmp/deon-${test.name}.png`, fullPage: true });
            await page.close();
          }

          await browser.close();
          JS
          node ./deon-smoke.mjs
          rm -f ./deon-smoke.mjs

      - name: Upload desktop and mobile screenshots
        uses: actions/upload-artifact@v4
        with:
          name: deon-creed-responsive-smoke
          path: |
            /tmp/deon-desktop.png
            /tmp/deon-mobile.png
          retention-days: 7
