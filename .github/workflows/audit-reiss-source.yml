name: Audit Reiss visual source

on:
  pull_request:
    paths:
      - ".github/workflows/audit-reiss-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: python -m pip install --quiet --upgrade pillow

      - name: Collect Reiss release artwork
        run: |
          set -euo pipefail
          mkdir -p /tmp/reiss-source/originals /tmp/reiss-source/contact

          for item in \
            "ULjYMdDHySM:nothing-given" \
            "Dvfg251n0Pk:on-route" \
            "FvNsYb5g4pg:on-a-regular" \
            "hqMBHn0L_DM:already-know" \
            "vsvn0Qkifv0:no-comment"; do
            id="${item%%:*}"
            name="${item##*:}"
            if ! curl --fail --location --silent --show-error \
              "https://i.ytimg.com/vi/${id}/maxresdefault.jpg" \
              --output "/tmp/reiss-source/originals/${name}.jpg"; then
              curl --fail --location --silent --show-error \
                "https://i.ytimg.com/vi/${id}/hqdefault.jpg" \
                --output "/tmp/reiss-source/originals/${name}.jpg"
            fi
          done

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          root = Path('/tmp/reiss-source')
          originals = root / 'originals'
          contact = root / 'contact'
          order = [
              ('nothing-given.jpg', 'Nothing Given · album'),
              ('on-route.jpg', 'On Route'),
              ('on-a-regular.jpg', 'On A Regular'),
              ('already-know.jpg', 'Already Know'),
              ('no-comment.jpg', 'No Comment'),
          ]
          font = ImageFont.load_default()
          cards = []

          for filename, label in order:
              path = originals / filename
              image = Image.open(path).convert('RGB')
              assert image.width >= 480 and image.height >= 270, (filename, image.size)
              print(filename, image.size)
              card = ImageOps.fit(image, (640, 360), method=Image.Resampling.LANCZOS)
              draw = ImageDraw.Draw(card)
              box = draw.textbbox((0, 0), label, font=font)
              draw.rectangle((0, 0, box[2] + 18, box[3] + 14), fill='black')
              draw.text((9, 7), label, fill='white', font=font)
              card.save(contact / filename, quality=94)
              cards.append(card)

          sheet = Image.new('RGB', (1280, 1080), 'black')
          for index, card in enumerate(cards):
              sheet.paste(card, ((index % 2) * 640, (index // 2) * 360))
          sheet.save(contact / 'reiss-release-art-contact-sheet.jpg', quality=94)
          PY

      - name: Upload Reiss source audit
        uses: actions/upload-artifact@v4
        with:
          name: reiss-visual-source-audit
          path: |
            /tmp/reiss-source/originals/*.jpg
            /tmp/reiss-source/contact/reiss-release-art-contact-sheet.jpg
          retention-days: 7
