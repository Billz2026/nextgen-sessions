name: Add Zion Daley Profile

on:
  push:
    branches: [main]
    paths:
      - "scripts/add-zion-daley.py"

permissions:
  contents: write

concurrency:
  group: nextgen-main-writers
  cancel-in-progress: false

jobs:
  add-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Zion Daley profile
        run: python3 scripts/add-zion-daley.py

      - name: Validate profile files
        run: |
          test -f assets/artists/zion-daley-portrait.webp
          test -f artists/zion-daley/index.html
          test -f artists/zion-daley/profile.js
          grep -q '"name": "Zion Daley"' artists.js
          grep -q '"zion-daley"' artist-images.js
          grep -q '"genre": "Reggae"' artists/zion-daley/profile.js
          grep -q 'Coming soon' artists/zion-daley/coming-soon.js
          grep -q 'Zion Daley' scripts/update-catalogue.py
          grep -q '33 artists' artists/index.html

      - name: Publish Zion Daley profile
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add artists.js artist-images.js artists/index.html artists/zion-daley scripts/update-catalogue.py sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Add Zion Daley reggae artist profile"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
