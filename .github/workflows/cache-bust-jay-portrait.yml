name: Cache bust Jay portrait

on:
  push:
    branches:
      - agent/perfect-jay-starks-profile
    paths:
      - ".jay-cache-bust"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/perfect-jay-starks-profile
          fetch-depth: 0

      - name: Version artist image registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          for filename in ('index.html', 'artists/index.html', 'artists/jay-starks/index.html'):
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text()
              text = re.sub(
                  r'src="/artist-images\.js(?:\?[^" ]*)?"',
                  'src="/artist-images.js?v=20260803-jay3"',
                  text,
              )
              path.write_text(text)
          PY
          rm -f .jay-cache-bust
          rm -f .github/workflows/cache-bust-jay-portrait.yml

      - name: Commit cache-busted entry points
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cache bust Jay Starks portrait across entry points"
          git push origin HEAD:agent/perfect-jay-starks-profile
