name: Upscale Kemar Ranka portrait

on:
  push:
    branches:
      - agent/perfect-kemar-ranka-profile
    paths:
      - .github/workflows/upscale-kemar-portrait.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upscale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/perfect-kemar-ranka-profile

      - name: Upscale and sharpen portrait
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter

          path = Path('assets/artists/kemar-ranka-portrait.webp')
          image = Image.open(path).convert('RGB')

          target = (1600, 2000)
          if image.size != target:
              image = image.resize(target, Image.Resampling.LANCZOS)

          image = image.filter(ImageFilter.UnsharpMask(radius=1.35, percent=115, threshold=3))
          image = ImageEnhance.Contrast(image).enhance(1.025)
          image = ImageEnhance.Sharpness(image).enhance(1.08)
          image.save(path, 'WEBP', quality=94, method=6)

          verified = Image.open(path)
          if verified.size != target:
              raise SystemExit(f'Unexpected output size: {verified.size}')
          print(f'Saved {path} at {verified.size[0]}x{verified.size[1]}')
          PY

      - name: Commit upgraded portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/artists/kemar-ranka-portrait.webp
          git commit -m "Upgrade Kemar Ranka portrait resolution" || exit 0
          git push origin HEAD:agent/perfect-kemar-ranka-profile
