name: Build approved Rell Danja portrait

on:
  pull_request:
    paths:
      - ".tmp/rell-danja/**"
      - "scripts/build-rell-danja-portrait.py"
      - ".github/workflows/build-rell-danja-portrait.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/rell-danja-portrait'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portrait transfer branch
        uses: actions/checkout@v4
        with:
          ref: agent/rell-danja-portrait
          fetch-depth: 0

      - name: Install image tools
        run: python -m pip install --quiet pillow

      - name: Build approved responsive assets
        run: python scripts/build-rell-danja-portrait.py

      - name: Validate generated WebP files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              "assets/artists/rell-danja-portrait.webp": (1120, 1400),
              "assets/artists/rell-danja-card.webp": (1024, 1280),
              "assets/artists/rell-danja-card-640.webp": (640, 800),
          }
          for filename, dimensions in expected.items():
              data = Path(filename).read_bytes()
              assert data[:4] == b"RIFF", filename
              assert data[8:12] == b"WEBP", filename
              assert len(data) > 35_000, (filename, len(data))
              with Image.open(filename) as image:
                  assert image.format == "WEBP", (filename, image.format)
                  assert image.size == dimensions, (filename, image.size)
              print(filename, dimensions, len(data))
          PY

      - name: Commit generated assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/artists/rell-danja-portrait.webp \
            assets/artists/rell-danja-card.webp \
            assets/artists/rell-danja-card-640.webp
          if git diff --cached --quiet; then
            echo "Rell Danja portrait assets are already current"
            exit 0
          fi
          git commit -m "Build approved Rell Danja portrait assets"
          git push origin HEAD:agent/rell-danja-portrait
