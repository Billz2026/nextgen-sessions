<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 540" role="img" aria-labelledby="title desc">
  <title id="title">NextGen Sessions</title>
  <desc id="desc">NextGen Sessions Original Music Network full gold brand lockup</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ad"/>
      <stop offset="0.14" stop-color="#ffe865"/>
      <stop offset="0.38" stop-color="#ffc31f"/>
      <stop offset="0.62" stop-color="#e79400"/>
      <stop offset="0.82" stop-color="#ffd64b"/>
      <stop offset="1" stop-color="#9b5700"/>
    </linearGradient>
    <linearGradient id="tagGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b96a00"/>
      <stop offset="0.17" stop-color="#ffd747"/>
      <stop offset="0.5" stop-color="#fff08a"/>
      <stop offset="0.83" stop-color="#ffd747"/>
      <stop offset="1" stop-color="#b96a00"/>
    </linearGradient>
    <radialGradient id="circleFill" cx="50%" cy="43%" r="66%">
      <stop offset="0" stop-color="#1b1100"/>
      <stop offset="0.72" stop-color="#090600"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <filter id="goldGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 .64 0 0 .43  0 0 .08 0 0  0 0 0 .72 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textDepth" x="-20%" y="-30%" width="150%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="7" flood-color="#000" flood-opacity=".9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffbb19" flood-opacity=".62"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <ellipse cx="645" cy="278" rx="640" ry="205" fill="#eaa000" opacity=".11" filter="url(#softGlow)"/>

  <g aria-label="NextGen Sessions circular mark">
    <circle cx="252" cy="270" r="225" fill="url(#circleFill)" stroke="#4b2800" stroke-width="18" opacity=".96"/>
    <circle cx="252" cy="270" r="221" fill="none" stroke="url(#gold)" stroke-width="9" filter="url(#goldGlow)"/>
    <circle cx="252" cy="270" r="201" fill="none" stroke="#e69a05" stroke-width="2" opacity=".55"/>

    <g fill="#ffbd18" opacity=".92">
      <circle cx="94" cy="151" r="4"/><circle cx="127" cy="119" r="2.5"/><circle cx="159" cy="82" r="3"/><circle cx="198" cy="117" r="2"/>
      <circle cx="241" cy="72" r="4"/><circle cx="282" cy="108" r="2.5"/><circle cx="326" cy="83" r="3.5"/><circle cx="369" cy="121" r="2"/>
      <circle cx="398" cy="163" r="4"/><circle cx="416" cy="209" r="2.5"/><circle cx="411" cy="263" r="3.5"/><circle cx="421" cy="315" r="2"/>
      <circle cx="391" cy="361" r="4"/><circle cx="370" cy="408" r="2.5"/><circle cx="329" cy="431" r="3"/><circle cx="285" cy="455" r="2"/>
      <circle cx="238" cy="436" r="3.5"/><circle cx="195" cy="455" r="2.5"/><circle cx="148" cy="422" r="4"/><circle cx="112" cy="390" r="2"/>
      <circle cx="85" cy="350" r="3.5"/><circle cx="72" cy="300" r="2.5"/><circle cx="80" cy="248" r="4"/><circle cx="71" cy="201" r="2"/>
      <circle cx="143" cy="181" r="2"/><circle cx="183" cy="147" r="3"/><circle cx="309" cy="158" r="2.5"/><circle cx="353" cy="195" r="3"/>
      <circle cx="137" cy="329" r="3"/><circle cx="181" cy="370" r="2.5"/><circle cx="315" cy="365" r="3.5"/><circle cx="356" cy="330" r="2"/>
    </g>

    <g text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-weight="900" filter="url(#textDepth)">
      <text x="252" y="257" font-size="83" letter-spacing="1" fill="#5d3000" stroke="#130900" stroke-width="10" paint-order="stroke">NEXTGEN</text>
      <text x="252" y="257" font-size="83" letter-spacing="1" fill="url(#gold)" stroke="#ffe66f" stroke-width="1.8" paint-order="stroke">NEXTGEN</text>
      <text x="252" y="344" font-size="78" letter-spacing="1" fill="#5d3000" stroke="#130900" stroke-width="10" paint-order="stroke">SESSIONS</text>
      <text x="252" y="344" font-size="78" letter-spacing="1" fill="url(#gold)" stroke="#ffe66f" stroke-width="1.8" paint-order="stroke">SESSIONS</text>
    </g>
  </g>

  <g transform="translate(510 36)" filter="url(#textDepth)" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-weight="900">
    <text x="0" y="205" font-size="218" letter-spacing="3" fill="#5d3000" stroke="#170b00" stroke-width="15" paint-order="stroke">NEXTGEN</text>
    <text x="0" y="205" font-size="218" letter-spacing="3" fill="url(#gold)" stroke="#fff08a" stroke-width="2.5" paint-order="stroke">NEXTGEN</text>

    <text x="75" y="392" font-size="184" letter-spacing="7" fill="#5d3000" stroke="#170b00" stroke-width="15" paint-order="stroke">SESSIONS</text>
    <text x="75" y="392" font-size="184" letter-spacing="7" fill="url(#gold)" stroke="#fff08a" stroke-width="2.5" paint-order="stroke">SESSIONS</text>
  </g>

  <line x1="570" y1="454" x2="1642" y2="454" stroke="#4c2900" stroke-width="11" opacity=".9"/>
  <line x1="570" y1="450" x2="1642" y2="450" stroke="url(#tagGold)" stroke-width="5" filter="url(#goldGlow)"/>
  <text x="1107" y="515" text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="54" font-weight="900" letter-spacing="16" fill="url(#tagGold)" stroke="#4b2800" stroke-width="1.6" paint-order="stroke" filter="url(#textDepth)">ORIGINAL MUSIC NETWORK</text>
</svg>