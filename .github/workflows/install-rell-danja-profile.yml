name: Install and validate Rell Danja profile

on:
  pull_request:
    paths:
      - "assets/artists/rell-danja-*.webp"
      - "scripts/install-rell-danja-profile.py"
      - ".github/workflows/install-rell-danja-profile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/rell-danja-profile-production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: agent/rell-danja-profile-production
          fetch-depth: 0

      - name: Install Rell Danja profile
        run: python3 scripts/install-rell-danja-profile.py

      - name: Validate production files
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          node --check artist-images.js
          node --check artists/rell-danja/profile.js
          grep -q '"rell-danja"' artist-images.js
          grep -q '/assets/artists/rell-danja-card.webp?v=20260804-rell1' artist-images.js
          grep -q '/artist-images.js?v=20260804-rell1' index.html
          grep -q '/artist-images.js?v=20260804-rell1' artists/index.html
          grep -q 'data-artist="rell-danja"' artists/rell-danja/index.html
          grep -q '919KvYLP_OQ' artists/rell-danja/profile.js
          grep -q '4mu5NVxUeII' artists/rell-danja/profile.js
          grep -q 'i2xhycshXEg' artists/rell-danja/profile.js
          grep -q 'https://nextgensessions.com/artists/rell-danja/' sitemap.xml
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              "assets/artists/rell-danja-portrait.webp": (1120, 1400),
              "assets/artists/rell-danja-card.webp": (1024, 1280),
              "assets/artists/rell-danja-card-640.webp": (640, 800),
          }
          for filename, dimensions in expected.items():
              data = Path(filename).read_bytes()
              assert data[:4] == b"RIFF"
              assert data[8:12] == b"WEBP"
              assert len(data) > 35_000
              with Image.open(filename) as image:
                  assert image.format == "WEBP"
                  assert image.size == dimensions
              print(filename, dimensions, len(data))
          PY

      - name: Install Chromium test runner
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Run desktop and mobile smoke tests
        run: |
          cat > .smoke-rell.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          fs.mkdirSync('rell-smoke', { recursive: true });

          async function visibleRellImage(locator, label) {
            await locator.scrollIntoViewIfNeeded();
            await locator.waitFor({ state: 'visible', timeout: 15000 });
            await locator.evaluate(async image => {
              if (!image.complete && typeof image.decode === 'function') {
                try { await image.decode(); } catch (_) {}
              }
            });
            const state = await locator.evaluate(image => ({
              complete: image.complete,
              naturalWidth: image.naturalWidth,
              naturalHeight: image.naturalHeight,
              currentSrc: image.currentSrc,
              hidden: image.hidden,
              display: getComputedStyle(image).display,
              visibility: getComputedStyle(image).visibility
            }));
            assert.equal(state.complete, true, `${label}: ${JSON.stringify(state)}`);
            assert.equal(state.hidden, false, `${label}: ${JSON.stringify(state)}`);
            assert.notEqual(state.display, 'none', `${label}: ${JSON.stringify(state)}`);
            assert.notEqual(state.visibility, 'hidden', `${label}: ${JSON.stringify(state)}`);
            assert.ok(state.currentSrc.includes('rell-danja-'), `${label}: ${JSON.stringify(state)}`);
            assert.ok(state.naturalWidth > 0, `${label}: ${JSON.stringify(state)}`);
            assert.ok(state.naturalHeight > state.naturalWidth, `${label}: ${JSON.stringify(state)}`);
          }

          for (const test of [
            { name: 'desktop', viewport: { width: 1440, height: 1000 } },
            { name: 'mobile', viewport: { width: 390, height: 844 } }
          ]) {
            const page = await browser.newPage({ viewport: test.viewport });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            const featured = page.locator('.featured-artist-card', { hasText: 'Rell Danja' }).first();
            await featured.waitFor({ state: 'attached', timeout: 15000 });
            await visibleRellImage(featured.locator('img.featured-artist-image'), `${test.name} homepage`);

            await page.goto('http://127.0.0.1:4173/artists/', { waitUntil: 'networkidle' });
            const roster = page.locator('.artist-roster-card', { hasText: 'Rell Danja' }).first();
            await roster.waitFor({ state: 'attached', timeout: 15000 });
            await visibleRellImage(roster.locator('img.artist-roster-image'), `${test.name} roster`);

            await page.goto('http://127.0.0.1:4173/artists/rell-danja/', { waitUntil: 'networkidle' });
            await visibleRellImage(page.locator('.profile-image'), `${test.name} profile`);
            assert.equal(await page.locator('.profile-image-shell.profile-image-missing').count(), 0);

            const count = page.locator('[data-discography-count]');
            await count.waitFor({ state: 'visible', timeout: 15000 });
            await page.waitForFunction(() => /3 releases/i.test(document.querySelector('[data-discography-count]')?.textContent || ''), null, { timeout: 15000 });
            assert.match(await count.innerText(), /3 releases/i);

            const titles = await page.locator('[data-discography-grid] .discography-card h3').allTextContents();
            for (const expected of ['Cross Me, Regret It', 'No Sleep Fi Di Wicked', 'Nuh Friend In The Street (No Friends Left)']) {
              assert.ok(titles.includes(expected), `Missing ${expected}: ${JSON.stringify(titles)}`);
            }

            const featuredRelease = page.locator('.discography-card', { hasText: 'Cross Me, Regret It' }).first();
            await featuredRelease.waitFor({ state: 'visible', timeout: 15000 });
            await featuredRelease.getByRole('button', { name: 'Play here' }).click();
            const iframe = page.locator('[data-featured-frame] iframe');
            await iframe.waitFor({ state: 'attached', timeout: 10000 });
            const src = await iframe.getAttribute('src');
            assert.ok(src?.includes('919KvYLP_OQ'), src || 'missing iframe source');
            assert.ok(src?.includes('autoplay=1'), src || 'missing iframe source');

            await page.screenshot({ path: `rell-smoke/rell-${test.name}.png`, fullPage: true });
            await page.close();
          }

          await browser.close();
          console.log('Rell Danja responsive smoke tests passed');
          JS
          python3 -m http.server 4173 >/tmp/rell-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node .smoke-rell.mjs

      - name: Upload validation screenshots
        uses: actions/upload-artifact@v4
        with:
          name: rell-danja-responsive-smoke
          path: rell-smoke/*.png
          if-no-files-found: error

      - name: Commit production profile changes
        run: |
          set -euo pipefail
          rm -rf node_modules package.json package-lock.json .smoke-rell.mjs rell-smoke
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artist-images.js \
            index.html \
            artists/index.html \
            artists/rell-danja/index.html \
            artists/rell-danja/profile.js \
            sitemap.xml
          if git diff --cached --quiet; then
            echo "Rell Danja production profile is already current"
            exit 0
          fi
          git commit -m "Complete Rell Danja artist profile"
          git push origin HEAD:agent/rell-danja-profile-production
