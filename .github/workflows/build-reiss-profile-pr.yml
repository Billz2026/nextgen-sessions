name: Build Reiss profile from PR

on:
  pull_request:
    paths:
      - ".github/workflows/build-reiss-profile-pr.yml"
      - "scripts/build-reiss-profile.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reiss branch
        uses: actions/checkout@v4
        with:
          ref: agent/reiss-profile-build
          fetch-depth: 0

      - name: Install image tools
        run: python -m pip install --quiet --upgrade pillow

      - name: Build responsive portrait and complete profile
        run: python scripts/build-reiss-profile.py

      - name: Validate generated files
        run: |
          set -euo pipefail
          node --check artist-images.js
          node --check artist-profiles-expanded.js
          node --check artist-albums.js
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected = {
              'assets/artists/reiss-portrait.webp': (1120, 1400),
              'assets/artists/reiss-card.webp': (1024, 1280),
              'assets/artists/reiss-card-640.webp': (640, 800),
          }
          for filename, dimensions in expected.items():
              data = Path(filename).read_bytes()
              assert data[:4] == b'RIFF'
              assert data[8:12] == b'WEBP'
              assert Image.open(filename).size == dimensions
              assert len(data) > 40_000
          PY
          grep -q 'reiss-card.webp?v=20260803-reiss1' artist-images.js
          grep -q '"imageKey": "reiss"' artist-profiles-expanded.js
          for id in Dvfg251n0Pk FvNsYb5g4pg hqMBHn0L_DM vsvn0Qkifv0 ULjYMdDHySM; do
            grep -q "$id" artist-profiles-expanded.js artist-albums.js artists/reiss/index.html
          done

      - name: Commit completed Reiss build
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/audit-reiss-source.yml .github/workflows/build-reiss-profile.yml .github/workflows/build-reiss-profile-pr.yml scripts/build-reiss-profile.py
          git add artist-images.js artist-profiles-expanded.js artist-albums.js index.html artists/index.html artists/reiss/index.html assets/artists/reiss-portrait.webp assets/artists/reiss-card.webp assets/artists/reiss-card-640.webp
          git commit -m "Complete Reiss portrait and profile"
          git push origin HEAD:agent/reiss-profile-build
