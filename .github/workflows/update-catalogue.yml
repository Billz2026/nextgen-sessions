name: Update Release Catalogue

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-catalogue.yml"
      - "scripts/update-catalogue.py"
      - "scripts/render-releases.py"

permissions:
  contents: write

concurrency:
  group: nextgen-main-writers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build catalogue from public playlists
        env:
          YT_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/update-catalogue.py releases.json

      - name: Render crawlable release archive and pages
        run: python3 scripts/render-releases.py releases.json

      - name: Validate catalogue
        run: |
          python3 - <<'PY'
          import json
          with open("releases.json", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data["total"] == len(data["releases"])
          assert len({item["id"] for item in data["releases"]}) == data["total"]
          assert data["total"] >= 80, f"Unexpectedly small catalogue: {data['total']}"
          assert len({item["url"] for item in data["releases"]}) == data["total"]
          assert all(item.get("published") for item in data["releases"])
          assert any(item["id"] == "ZSjRD_3B5uk" for item in data["releases"]), "Days Like These missing"
          assert any(item["id"] == "6H6yq_1bEsQ" for item in data["releases"]), "After Di Party missing"
          assert all(__import__("os").path.exists("." + item["url"] + "index.html") for item in data["releases"])
          archive = open("releases/index.html", encoding="utf-8").read()
          assert "Loading catalogue…" not in archive
          assert archive.count('class="archive-release-card"') >= data["total"]
          print(json.dumps({"total": data["total"], "counts": data["counts"]}, indent=2))
          PY

      - name: Publish changed catalogue
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add releases.json releases/ sitemap.xml artists/ artist-profiles.js artist-profiles-expanded.js
          git diff --cached --quiet && exit 0
          git commit -m "Auto-update release catalogue"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not update main after 3 attempts."
          exit 1
