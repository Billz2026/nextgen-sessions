name: Finalize Jay approved portrait

on:
  push:
    branches:
      - agent/perfect-jay-starks-profile
    paths:
      - ".jay-portrait/**"

permissions:
  contents: write

concurrency:
  group: finalize-jay-approved-portrait-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/perfect-jay-starks-profile
          fetch-depth: 0

      - name: Install approved portrait and playback fix
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f .jay-portrait/portrait.b64 ]]; then
            echo "Portrait payload has not arrived yet"
            exit 0
          fi

          base64 --decode .jay-portrait/portrait.b64 > /tmp/jay-starks-approved.webp

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('/tmp/jay-starks-approved.webp')
          data = path.read_bytes()
          expected = 'fe506b5895a2cd71e8cda4ea7f1e8d8c01072140f91bcc4ddb0222fd178b9c66'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'Portrait checksum mismatch: {actual}')
          if len(data) < 12 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Portrait is not a genuine WebP binary')
          print(f'Validated approved WebP: {len(data)} bytes, sha256={actual}')
          PY

          mkdir -p assets/artists
          mv /tmp/jay-starks-approved.webp assets/artists/jay-starks-portrait-approved.webp

          python3 - <<'PY'
          from pathlib import Path
          import re

          relative = '/assets/artists/jay-starks-portrait-approved.webp?v=20260803-1'
          absolute = 'https://nextgensessions.com/assets/artists/jay-starks-portrait-approved.webp?v=20260803-1'

          images_path = Path('artist-images.js')
          images = images_path.read_text()
          new_block = '''  "jay-starks": {
            src: "/assets/artists/jay-starks-portrait-approved.webp?v=20260803-1",
            portrait: "/assets/artists/jay-starks-portrait-approved.webp?v=20260803-1",
            fallback: "/assets/artists/jay-starks-portrait-approved.webp?v=20260803-1",
            position: "50% 36%"
          },
          '''
          images, count = re.subn(
              r'  "jay-starks": \{.*?\n  \},\n  "kemarco":',
              new_block + '  "kemarco":',
              images,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not replace Jay Starks image-library block')
          images_path.write_text(images)

          profile_path = Path('featured-artist-profiles.js')
          profile = profile_path.read_text()
          profile = re.sub(
              r'/assets/artists/jay-starks-portrait[^"\'\s]*',
              relative,
              profile,
          )
          profile_path.write_text(profile)

          page_path = Path('artists/jay-starks/index.html')
          page = page_path.read_text()
          page = re.sub(
              r'https://nextgensessions\.com/assets/artists/jay-starks-portrait[^"\'\s]*',
              absolute,
              page,
          )
          for script in ('featured-artist-profiles.js', 'jay-starks-profile-fix.js', 'featured-artist-experience.js'):
              page = re.sub(
                  rf'src="/{re.escape(script)}(?:\?[^" ]*)?"',
                  f'src="/{script}?v=20260803-jay2"',
                  page,
              )
          page_path.write_text(page)

          experience_path = Path('featured-artist-experience.js')
          experience = experience_path.read_text()
          experience = experience.replace(
              '?rel=0&amp;modestbranding=1&amp;autoplay=1"',
              '?rel=0&amp;modestbranding=1&amp;autoplay=1&amp;playsinline=1"',
          )
          experience, count = re.subn(
              r'(bar\.hidden = false;\s*document\.body\.classList\.add\("has-profile-player"\);\s*setActiveRelease\(id\);)',
              r'\1\n    smoothScrollTo("featured-release");',
              experience,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not add one-tap scroll/play behaviour')
          experience_path.write_text(experience)

          for obsolete in (
              'assets/artists/jay-starks-portrait-v2.webp',
              'assets/artists/jay-starks-portrait-v3.svg',
              'assets/artists/jay-starks-portrait-v4.webp',
          ):
              Path(obsolete).unlink(missing_ok=True)
          PY

          rm -rf .jay-portrait
          rm -f .github/workflows/finalize-jay-approved-portrait.yml

      - name: Commit completed portrait and playback fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install approved Jay Starks portrait and one-tap playback"
          git push origin HEAD:agent/perfect-jay-starks-profile
