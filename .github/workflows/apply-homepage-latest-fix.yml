name: Apply homepage latest fix

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/fix-alonzo-portrait-source.py
      - .github/workflows/apply-homepage-latest-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/homepage-latest-and-alonzo-crop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-latest-and-alonzo-crop
      - name: Switch Alonzo to clean full-head portrait
        run: |
          python scripts/fix-alonzo-portrait-source.py
          node --check site.js
          node --check functions/api/latest.js
      - name: Commit portrait correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artist-profiles.js artists/alonzo-ray/index.html .github/workflows/validate-homepage-latest-fix.yml
          git commit -m "Use clean full-head portrait for Alonzo profile" || exit 0
          git push
