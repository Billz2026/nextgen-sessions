name: Finalize Jay Starks portrait

on:
  push:
    branches:
      - agent/perfect-jay-starks-profile

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/perfect-jay-starks-profile
          fetch-depth: 0

      - name: Decode genuine WebP and update references
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          svg_path = Path('assets/artists/jay-starks-portrait-v3.svg')
          svg = svg_path.read_text(encoding='utf-8')
          match = re.search(r'href="data:image/webp;base64,([^"]+)"', svg)
          if not match:
              raise SystemExit('Embedded Jay portrait was not found')

          raw = base64.b64decode(match.group(1), validate=True)
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise SystemExit('Decoded asset is not a valid WebP container')

          output = Path('assets/artists/jay-starks-portrait-v4.webp')
          output.write_bytes(raw)

          replacements = [
              Path('artist-images.js'),
              Path('featured-artist-profiles.js'),
              Path('artists/jay-starks/index.html'),
          ]
          pattern = re.compile(r'jay-starks-portrait-v(?:2\.webp|3\.svg)(?:\?v=[A-Za-z0-9._-]+)?')
          for path in replacements:
              text = path.read_text(encoding='utf-8')
              text = pattern.sub('jay-starks-portrait-v4.webp?v=20260802-1', text)
              path.write_text(text, encoding='utf-8')
          PY

          file assets/artists/jay-starks-portrait-v4.webp
          test "$(stat -c%s assets/artists/jay-starks-portrait-v4.webp)" -gt 40000

          rm -f assets/artists/jay-starks-portrait-v2.webp
          rm -f assets/artists/jay-starks-portrait-v3.svg
          rm -rf .jay-portrait
          rm -f .github/workflows/finalize-jay-starks-portrait.yml

      - name: Commit finalized portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Jay Starks portrait as binary WebP"
          git push origin HEAD:agent/perfect-jay-starks-profile
