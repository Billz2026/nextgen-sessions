name: Clean up Kemar portrait workflow

on:
  push:
    branches:
      - agent/perfect-kemar-ranka-profile
    paths:
      - .github/workflows/cleanup-kemar-portrait-workflow.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/perfect-kemar-ranka-profile

      - name: Remove one-time workflow files
        run: |
          rm -f .github/workflows/upscale-kemar-portrait.yml
          rm -f .github/workflows/cleanup-kemar-portrait-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary Kemar portrait workflows" || exit 0
          git push origin HEAD:agent/perfect-kemar-ranka-profile
