name: Standardise Privacy Footer

on:
  push:
    branches: [main]
    paths:
      - "scripts/standardise-privacy-footer.py"

permissions:
  contents: write

concurrency:
  group: nextgen-main-writers
  cancel-in-progress: false

jobs:
  standardise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Standardise Privacy links
        run: python3 scripts/standardise-privacy-footer.py

      - name: Rebuild generated release pages
        run: python3 scripts/render-releases.py releases.json

      - name: Validate global footer and generator
        run: |
          python3 -m py_compile scripts/render-releases.py scripts/test-global-footer.py
          python3 scripts/test-global-footer.py
          python3 - <<'PY'
          from pathlib import Path
          renderer = Path('scripts/render-releases.py').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/update-catalogue.yml').read_text(encoding='utf-8')
          assert '<a href="/privacy/">Privacy</a>' in renderer
          assert 'Test global Privacy footer' in workflow
          print('Privacy footer source validation passed')
          PY

      - name: Publish standardised footers
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m "Standardise Privacy link across site footers"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
